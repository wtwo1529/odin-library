<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Library</title><script defer="defer" src="main.js"></script></head><body><div class="container"><table class="library"><thead><tr><th colspan="20" class="library-header">All Books</th></tr><tr><th colspan="1" class="status"></th><th colspan="1" class="column-header" id="book-index">#</th><th colspan="7" class="column-header" id="name-th">Name</th><th colspan="5" class="column-header">Author</th><th colspan="4" class="column-header" id="pages-th">No. of Pages</th><th colspan="2" class="column-header">Score</th></tr></thead><tbody class="library-display"></tbody><nav class="sidebar-container"><ul class="sidebar"><li><button data-modal-target=".modal" id="newBookBtn" type="button" title="Add Book"><img class="newBookBtnIcon" src="3cffe9a515498593b872.svg"/></button></li></ul></nav></table><div id="modal" class="modal"><div class="modal-header"><div class="title">Add Book</div><button data-close-button class="close-button">&times;</button></div><div class="modal-body"><form class="modal-form"><div class="book-name-container"><label for="book-name">Book Name</label> <input required id="book-name"/></div><div class="book-author-container"><label for="book-author">Author</label> <input required id="book-author"/></div><div class="book-pages-container"><label for="book-pages">No. of Pages</label> <input id="book-pages" type="number" min="0"/></div><div class="book-status-container"><label for="book-status">Status</label> <select required id="book-status"><option selected="selected" disabled="disabled" value="">Select Status</option><option value="reading">Reading</option><option value="completed">Completed</option><option value="onhold">On-Hold</option><option value="dropped">Dropped</option><option value="plantoread">Plan to Read</option></select></div><div class="book-score-container"><label for="book-score">Your Score</label> <select required id="book-score"><option selected="selected" disabled="disabled" value="">Select Score</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></div><div class="btn-container"><button type="button" class="submit-form">Submit</button></div></form></div></div><div id="overlay"></div></div></body></html>
